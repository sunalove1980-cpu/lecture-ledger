<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b45309" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bg-grad)" />
  
  <!-- Subtle decorative inner glow/border -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" />

  <!-- Main Calendar Card -->
  <g filter="url(#drop-shadow)">
    <rect x="96" y="106" width="320" height="300" rx="36" fill="url(#card-grad)" />
    
    <!-- Calendar Top Bar -->
    <path d="M96 142 C96 122.118 112.118 106 132 106 L380 106 C399.882 106 416 122.118 416 142 L416 182 L96 182 Z" fill="#4338ca" />
    
    <!-- Calendar Ring Binders -->
    <rect x="164" y="82" width="24" height="48" rx="12" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />
    <rect x="324" y="82" width="24" height="48" rx="12" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />

    <!-- Calendar Grid Lines / Dots -->
    <circle cx="160" cy="234" r="14" fill="#e2e8f0" />
    <circle cx="224" cy="234" r="14" fill="#e2e8f0" />
    <circle cx="288" cy="234" r="14" fill="#e2e8f0" />
    <circle cx="352" cy="234" r="14" fill="#e2e8f0" />

    <circle cx="160" cy="294" r="14" fill="#e2e8f0" />
    <circle cx="224" cy="294" r="14" fill="#818cf8" />
    <circle cx="288" cy="294" r="14" fill="#e2e8f0" />
    <circle cx="352" cy="294" r="14" fill="#e2e8f0" />

    <!-- Highlighted event bar -->
    <rect x="144" y="338" width="136" height="28" rx="10" fill="#e0e7ff" />
    <rect x="152" y="346" width="70" height="12" rx="6" fill="#6366f1" />
  </g>

  <!-- Golden Coin Emblem (Revenue / Profit) -->
  <g filter="url(#coin-shadow)">
    <circle cx="368" cy="358" r="72" fill="url(#gold-grad)" stroke="#fef3c7" stroke-width="6" />
    <circle cx="368" cy="358" r="56" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6 4" />
    
    <!-- Korean Won Symbol ₩ -->
    <text x="368" y="378" font-family="'Pretendard', sans-serif" font-size="56" font-weight="900" fill="#78350f" text-anchor="middle">₩</text>
  </g>

  <!-- Sparkle Accent -->
  <path d="M424 260 L430 278 L448 284 L430 290 L424 308 L418 290 L400 284 L418 278 Z" fill="#ffffff" opacity="0.9" />
</svg>