<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-pastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0c4a6e" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pastel Squircle Background -->
  <rect width="512" height="512" rx="118" fill="url(#bg-pastel)" />
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="5" />

  <!-- Calendar Card -->
  <g filter="url(#soft-shadow)">
    <rect x="100" y="112" width="312" height="290" rx="34" fill="url(#card-grad)" />
    
    <!-- Calendar Top Bar (Soft Sky Blue) -->
    <path d="M100 146 C100 127.222 115.222 112 134 112 L378 112 C396.778 112 412 127.222 412 146 L412 182 L100 182 Z" fill="#0284c7" />
    
    <!-- Rings -->
    <rect x="166" y="90" width="22" height="44" rx="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="3.5" />
    <rect x="324" y="90" width="22" height="44" rx="11" fill="#e0f2fe" stroke="#0369a1" stroke-width="3.5" />

    <!-- Grid Dots -->
    <circle cx="162" cy="230" r="13" fill="#e2e8f0" />
    <circle cx="224" cy="230" r="13" fill="#e2e8f0" />
    <circle cx="286" cy="230" r="13" fill="#e2e8f0" />
    <circle cx="348" cy="230" r="13" fill="#e2e8f0" />

    <circle cx="162" cy="286" r="13" fill="#e2e8f0" />
    <circle cx="224" cy="286" r="13" fill="#38bdf8" />
    <circle cx="286" cy="286" r="13" fill="#e2e8f0" />
    <circle cx="348" cy="286" r="13" fill="#e2e8f0" />

    <!-- Event bar -->
    <rect x="146" y="330" width="128" height="24" rx="8" fill="#e0f2fe" />
    <rect x="154" y="336" width="60" height="12" rx="6" fill="#0284c7" />
  </g>

  <!-- Pastel Gold Coin (₩) -->
  <g filter="url(#soft-shadow)">
    <circle cx="366" cy="352" r="66" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="5" />
    <circle cx="366" cy="352" r="52" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="5 3" />
    <text x="366" y="371" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" fill="#854d0e" text-anchor="middle">₩</text>
  </g>
</svg>